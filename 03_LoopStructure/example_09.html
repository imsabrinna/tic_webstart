<!-- Exemplo de um laço infinito. A inicialização da variável Contador deveria ser feita antes do comando Do..While. -->

<meta charset="UTF-8">
<script>
    alert("Contador de números!");

    var contador = 1; // Consertando laço infinito.
    do {
        // var contador = 1; Laço infinito.
        document.write(contador + "<br>");
        contador = contador + 1;
    } while (contado <10);
</script>
